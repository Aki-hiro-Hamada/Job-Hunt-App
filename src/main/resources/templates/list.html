<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>応募先一覧 | Job Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>応募先一覧</h1>
            <a th:href="@{/applications/create}" class="btn">＋ 新規登録</a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>会社名</th>
                    <th>ステータス</th>
                    <th>面接日</th>
                    <th>メモ</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${app.companyName}"></td>
                    <td>
                        <span class="status-badge" th:text="${app.status}"></span>
                    </td>
                    <td th:text="${app.interviewDate}"></td>
                    <td th:text="${app.memo}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(applications)}">
                    <td colspan="4" style="text-align: center; color: #94a3b8; padding: 3rem;">
                        登録された応募先がありません。
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
