<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>応募先一覧 | Job Applications</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>内定ホイホイ</h1>
            <p class="header-meta" th:if="${ingCount != null}">
                書類選考中: <span th:text="${ingCount}">0</span> 件
            </p>
            <a th:href="@{/applications/create}" class="btn">＋ 新規登録</a>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>会社名</th>
                    <th>ステータス</th>
                    <th>面接日</th>
                    <th>メモ</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="app : ${applications}">
                    <td th:text="${app.companyName}"></td>
                    <td>
                        <span class="status-badge" th:text="${app.status}"></span>
                    </td>
					<!-- 年と月日の間で改行し、日本語形式にする -->
					<td th:text="${#temporals.format(app.interviewDate, 'yyyy年') + '&#10;' + #temporals.format(app.interviewDate, 'M月d日')}"></td>
					<td class="memo-cell">
                        <div th:text="${app.memo}"></div>
                        <a th:if="${app.websiteUrl != null and !#strings.isEmpty(app.websiteUrl)}"
                           th:href="${app.websiteUrl.startsWith('http') ? app.websiteUrl : 'https://' + app.websiteUrl}"
                           target="_blank" rel="noopener noreferrer">企業ページ</a>
                    </td>
                    <td>
                        <a th:href="@{/applications/edit/{id}(id=${app.id})}" class="btn btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">編集</a>
						<a th:href="@{/applications/delete/{id}(id=${app.id})}" 
						      class="btn btn-delete" 
						      onclick="return confirm('本当にこの応募情報を駆除（削除）しますか？')"
						      style="padding: 0.25rem 0.75rem; font-size: 0.875rem; margin-left: 5px;">削除</a>
                        <form th:action="@{/applications/{id}/history(id=${app.id})}" method="post" style="margin-top: 0.5rem;">
                            <input type="date" name="eventDate" required>
                            <input type="text" name="action" placeholder="アクション（例：応募）" required>
                            <button type="submit">履歴を追加</button>
                        </form>
					</td>
                </tr>
                <tr th:if="${#lists.isEmpty(applications)}">
                    <td colspan="5" style="text-align: center; color: #94a3b8; padding: 3rem;">
                        登録された応募先がありません。
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
