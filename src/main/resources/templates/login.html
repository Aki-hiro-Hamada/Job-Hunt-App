<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | 内定ホイホイ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 560px;">
    <div class="header">
        <h1>内定ホイホイ</h1>
        <p style="margin: 0.5rem 0 0; color: #cbd5e1;">ログインして応募管理を続ける</p>
    </div>

    <div th:if="${param.registered}" style="margin-bottom: 1rem; color: #34d399;">
        登録が完了しました。ログインしてください。
    </div>
    <div th:if="${param.error}" style="margin-bottom: 1rem; color: #fca5a5;">
        ユーザー名またはパスワードが違います。
    </div>
    <div th:if="${param.logout}" style="margin-bottom: 1rem; color: #cbd5e1;">
        ログアウトしました。
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div style="margin-bottom: 0.8rem;">
            <label for="username">ユーザー名</label>
            <input id="username" name="username" type="text" required autocomplete="username"
                   style="width: 100%; padding: 0.65rem; border-radius: 10px; border: 1px solid rgba(255,215,0,0.25); background: rgba(15,23,42,0.6); color: #e2e8f0;">
        </div>
        <div style="margin-bottom: 1.2rem;">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" required autocomplete="current-password"
                   style="width: 100%; padding: 0.65rem; border-radius: 10px; border: 1px solid rgba(255,215,0,0.25); background: rgba(15,23,42,0.6); color: #e2e8f0;">
        </div>

        <button type="submit" class="btn" style="width: 100%;">ログイン</button>
    </form>

    <div style="margin-top: 1rem; text-align: center;">
        <a th:href="@{/register}" class="btn" style="width: 100%; display: inline-block;">新規登録</a>
    </div>
</div>
</body>
</html>
