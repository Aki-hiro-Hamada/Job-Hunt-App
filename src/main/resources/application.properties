# Render 等は PORT を注入。ローカルは 8081 のまま
server.port=${PORT:8081}

# MongoDB Atlas URI は環境変数 MONGODB_URI で渡す（接続文字列に ? & などがあるため export 時はクォート推奨）
spring.data.mongodb.uri=${MONGODB_URI}

